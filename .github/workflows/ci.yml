name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    name: Lint, type-check y build (mercadotech)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mercadotech

    # Next.js necesita estas variables para el build (algunas páginas
    # construyen el cliente de Supabase al prerenderizar). No son secretos
    # reales — el build no llega a conectarse a la base, solo necesita que
    # las variables existan con forma válida.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mercadotech/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build

  mcp:
    name: Type-check del servidor MCP
    runs-on: ubuntu-latest
    # Sin defaults.run.working-directory acá: los pasos de instalar
    # dependencias necesitan carpetas DISTINTAS (ver el paso de abajo), a
    # diferencia del job "web".

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            mercadotech/package-lock.json
            mercadotech/mcp/package-lock.json

      # mcp/tsconfig.json resuelve el alias @/* -> ../* hacia
      # services/lib/ai/, que importan @supabase/supabase-js, @supabase/ssr
      # y @huggingface/inference — paquetes que NO están en
      # mercadotech/mcp/package.json (solo @modelcontextprotocol/sdk, zod y
      # tsup), sino en mercadotech/package.json. En desarrollo esto resuelve
      # solo porque mercadotech/node_modules ya existe en la máquina; en un
      # runner de CI limpio hay que instalarlo explícitamente ANTES del
      # type-check de mcp/, o falla con "Cannot find module".
      - name: Instalar dependencias (mercadotech)
        working-directory: mercadotech
        run: npm ci

      - name: Instalar dependencias (mcp)
        working-directory: mercadotech/mcp
        run: npm ci

      - name: Type-check
        working-directory: mercadotech/mcp
        run: npm run type-check
